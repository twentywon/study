<title>강의 서재</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 상단 고정 메뉴 + 본문 단일 열(강의 읽기는 목차 | 본문 2열, 검토는 본문 | 결정 패널 2열) */
:root {
  --bg: #f2f3ee; --surface: #fcfcf9; --surface-2: #e7e9e1; --ink: #1d2320; --ink-2: #48514b; --ink-3: #737b75;
  --line: #d6d9cf; --accent: #2b4a3b; --accent-ink: #eef2ec; --accent-soft: #dbe5dc;
  --red: #a23b2c; --red-soft: #f3dfda; --amber: #855700; --amber-soft: #f3e7cb; --green: #2a673b; --green-soft: #dbebdb;
  --shadow: 0 1px 2px rgb(20 30 20 / 6%), 0 6px 20px rgb(20 30 20 / 6%);
  --serif: 'Noto Serif KR', 'Nanum Myeongjo', 'AppleMyungjo', serif;
  --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151917; --surface: #1d2220; --surface-2: #262c29; --ink: #e7e8e1; --ink-2: #bcc0b8; --ink-3: #8b918b;
    --line: #333a36; --accent: #9ec3aa; --accent-ink: #132019; --accent-soft: #23362b;
    --red: #e69083; --red-soft: #3a2420; --amber: #e0b765; --amber-soft: #372d17; --green: #92d1a2; --green-soft: #1e3324;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 6px 20px rgb(0 0 0 / 25%); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151917; --surface: #1d2220; --surface-2: #262c29; --ink: #e7e8e1; --ink-2: #bcc0b8; --ink-3: #8b918b;
  --line: #333a36; --accent: #9ec3aa; --accent-ink: #132019; --accent-soft: #23362b;
  --red: #e69083; --red-soft: #3a2420; --amber: #e0b765; --amber-soft: #372d17; --green: #92d1a2; --green-soft: #1e3324;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 6px 20px rgb(0 0 0 / 25%); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.7 var(--sans); }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--serif); line-height: 1.35; letter-spacing: -0.01em; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--bg); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 16px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink);
  font-family: var(--serif); font-weight: 900; font-size: 18px; white-space: nowrap; }
.brand svg { width: 26px; height: 26px; flex: none; }
.brand svg rect { fill: var(--accent); } .brand svg path { fill: var(--accent-ink); }
.nav { display: flex; gap: 4px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.nav a { padding: 6px 12px; border-radius: 999px; text-decoration: none; color: var(--ink-2); font-size: 15px;
  white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.nav a:hover { background: var(--surface-2); }
.nav a.active { background: var(--accent); color: var(--accent-ink); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--red); color: var(--surface);
  font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }
.theme-toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 34px; height: 34px; cursor: pointer; flex: none; }
.progress { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; height: 3px; width: 0; background: var(--accent); z-index: 30; }

main { max-width: 1180px; margin: 0 auto; padding-block: 32px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.page-head h1 { margin: 0; font-size: 30px; }
.page-head p { margin: 4px 0 0; color: var(--ink-2); }
.eyebrow { font-size: 13px; color: var(--ink-3); letter-spacing: .03em; margin-bottom: 4px; }
.eyebrow a { color: inherit; }
.muted { color: var(--ink-3); }
.notice { padding: 10px 14px; border-radius: 8px; background: var(--amber-soft); color: var(--amber); font-size: 14px; margin-bottom: 16px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer; text-decoration: none; color: var(--ink); font-size: 15px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 500; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, var(--line)); }
.btn.danger:hover { background: var(--red-soft); }
.btn.solid-danger { background: var(--red); border-color: var(--red); color: var(--surface); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 14px; color: var(--ink-2); font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); }
.field textarea { min-height: 80px; resize: vertical; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 14px; }
.seg button { flex: 1; padding: 8px; border: 0; background: var(--surface); cursor: pointer; }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.seg button:disabled { opacity: .45; cursor: not-allowed; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.course-card { display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: transform .15s; }
.course-card:hover { transform: translateY(-2px); }
.cover { aspect-ratio: 16 / 9; max-width: 100%; background: var(--surface-2) center / cover no-repeat; }
.cover.empty { display: grid; place-items: center; font-family: var(--serif); font-size: 40px; font-weight: 900; color: var(--ink-3);
  background: repeating-linear-gradient(135deg, var(--surface-2) 0 14px, var(--bg) 14px 28px); }
.course-body { padding: 16px 18px 18px; }
.course-body h3 { margin: 0 0 4px; font-size: 20px; }
.course-body p { margin: 0; color: var(--ink-2); font-size: 14px; }
.course-meta { margin-top: 10px; font-size: 13px; color: var(--ink-3); display: flex; gap: 12px; }
.empty-state { text-align: center; padding: 56px 24px; border: 1px dashed var(--line); border-radius: var(--radius); color: var(--ink-2); background: var(--surface); }
.empty-state h2 { margin: 0 0 8px; font-size: 22px; }
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; text-decoration: none; color: inherit; }
.stat b { display: block; font-size: 26px; font-family: var(--serif); font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink-3); }
.stat.alert b { color: var(--red); }

.course-hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 28px; align-items: center; margin-bottom: 32px; }
.course-hero .cover { border-radius: var(--radius); }
.course-hero h1 { font-size: 34px; margin: 0 0 6px; }
.course-hero .sub { font-size: 18px; color: var(--ink-2); margin: 0 0 12px; }
.course-hero .lead { color: var(--ink-2); white-space: pre-line; }
.cover-credit { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
.row-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.resume-card { display: grid; gap: 2px; padding: 14px 18px; margin: 4px 0 14px; text-decoration: none; color: var(--ink);
  border-left: 4px solid var(--accent); transition: border-color .15s, background .15s; }
.resume-card:hover { background: var(--surface-2); }
.resume-card .resume-label { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: .02em; }
.resume-card b { font-family: var(--serif); font-size: 18px; line-height: 1.4; }
.resume-card .resume-note { font-size: 13px; color: var(--ink-2); }
.nowrap { white-space: nowrap; }
.lecture-item h3 .chip { vertical-align: middle; font-family: var(--sans); font-weight: 500; }
.lecture-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.lecture-item { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 16px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; }
.lecture-no { font-family: var(--serif); font-weight: 900; font-size: 22px; color: var(--accent); text-align: center; line-height: 1.1; font-variant-numeric: tabular-nums; }
.lecture-no small { display: block; font-size: 12px; font-weight: 500; color: var(--ink-3); font-family: var(--sans); }
.lecture-item h3 { margin: 0; font-size: 18px; }
.lecture-item h3 a { color: var(--ink); text-decoration: none; }
.lecture-item h3 a:hover { color: var(--accent); }
.lecture-item p { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }
.lecture-tools { display: flex; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.chip.err { background: var(--red-soft); color: var(--red); }
.chip.warn { background: var(--amber-soft); color: var(--amber); }
.chip.ok { background: var(--green-soft); color: var(--green); }

.review-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
.review-panel { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); padding: 20px; max-height: calc(100vh - 96px); overflow: auto; }
.review-panel h2 { font-size: 18px; margin: 0 0 12px; }
.review-panel hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
.issue-list { list-style: none; padding: 0; margin: 0 0 8px; display: grid; gap: 6px; font-size: 13px; }
.issue-list li { padding: 6px 10px; border-radius: 6px; }
.issue-list .error { background: var(--red-soft); color: var(--red); }
.issue-list .warn { background: var(--amber-soft); color: var(--amber); }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.stat-grid div { background: var(--surface-2); border-radius: 6px; padding: 6px 8px; font-size: 12px; color: var(--ink-3); }
.stat-grid b { display: block; font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; }
.inbox-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 18px 20px; }
.inbox-item h3 { margin: 0 0 2px; font-size: 19px; }
.inbox-item h3 a { color: var(--ink); text-decoration: none; }
.inbox-item p { margin: 0; color: var(--ink-2); font-size: 14px; }
.inbox-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.inbox-actions .btn { white-space: nowrap; }
.pos-note { margin: 0; font-size: 15px; } .pos-note b { font-size: 17px; margin-right: 4px; } .pos-note .muted { font-size: 13px; }
.stack { display: grid; gap: 12px; }
.panel-buttons { display: grid; gap: 8px; }

.reader { display: grid; grid-template-columns: 220px minmax(0, 760px); gap: 48px; justify-content: center; }
.review-layout .reader { grid-template-columns: minmax(0, 1fr); }
.review-layout .toc { display: none; }
.toc { position: sticky; top: calc(84px + env(safe-area-inset-top, 0px)); align-self: start; font-size: 14px; max-height: calc(100vh - 110px); overflow: auto; }
.toc b { display: block; font-size: 12px; color: var(--ink-3); letter-spacing: .06em; margin-bottom: 8px; }
.toc a { display: block; padding: 4px 0 4px 12px; color: var(--ink-2); text-decoration: none; border-left: 2px solid var(--line); line-height: 1.45; }
.toc a.h3 { padding-left: 24px; font-size: 13px; }
.toc a.on { color: var(--accent); border-color: var(--accent); font-weight: 500; }
.lecture-head { margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.lecture-head .no { font-family: var(--serif); color: var(--accent); font-weight: 700; }
.lecture-head h1 { font-size: 36px; margin: 4px 0 8px; }
.lecture-head .sub { font-size: 18px; color: var(--ink-2); margin: 0 0 12px; }
.lecture-head .meta-line { font-size: 14px; color: var(--ink-3); display: flex; gap: 14px; flex-wrap: wrap; }
.lecture-head .summary { margin: 14px 0 0; color: var(--ink-2); }
.objectives { background: var(--accent-soft); border-radius: var(--radius); padding: 16px 20px; margin: 20px 0 0; }
.objectives b { color: var(--accent); }
.objectives ul { margin: 6px 0 0; padding-left: 20px; }

.prose { font-size: 17px; line-height: 1.85; word-break: keep-all; overflow-wrap: anywhere; max-width: 68ch; }
.review-layout .prose, .reader .prose { max-width: none; }
.prose h2 { font-size: 26px; margin: 56px 0 16px; padding-top: 8px; scroll-margin-top: 80px; }
.prose h3 { font-size: 20px; margin: 36px 0 12px; scroll-margin-top: 80px; }
.prose h4 { font-size: 17px; margin: 24px 0 8px; }
.prose p { margin: 0 0 1.1em; }
.prose strong { color: var(--ink); background: linear-gradient(transparent 62%, color-mix(in srgb, var(--accent) 18%, transparent) 62%); }
.prose blockquote { margin: 24px 0; padding: 4px 20px; border-left: 3px solid var(--accent); color: var(--ink-2); font-family: var(--serif); background: var(--surface); border-radius: 0 8px 8px 0; }
.prose ul, .prose ol { padding-left: 1.4em; }
.prose li { margin: 4px 0; }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }
.prose code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
.prose pre { background: var(--surface-2); padding: 14px; border-radius: 8px; overflow: auto; font-size: 13px; line-height: 1.6; }
.prose pre code { background: none; padding: 0; }
.table-wrap { overflow-x: auto; margin: 24px 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.prose table { border-collapse: collapse; width: 100%; font-size: 15px; line-height: 1.6; }
.prose th, .prose td { padding: 10px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.prose th { background: var(--surface-2); font-weight: 700; white-space: nowrap; }
.prose tr:last-child td { border-bottom: 0; }
.table-caption { font-size: 14px; color: var(--ink-3); margin: -14px 0 24px; }

.figure { margin: 32px 0; }
/* 넓은 그림: 목차와의 간격(48px) 안에서만 넓힌다. 더 넓히면 고정된 목차가 그림·캡션을 덮는다 */
.figure.wide { margin-left: -24px; margin-right: -24px; }
.review-layout .figure.wide { margin-left: 0; margin-right: 0; }
.figure.narrow { max-width: 460px; margin-left: auto; margin-right: auto; }
.figure .frame { background: var(--surface-2); border-radius: var(--radius); overflow: hidden; display: grid; place-items: center; cursor: zoom-in; }
.figure img { display: block; max-height: 620px; width: auto; max-width: 100%; }
.figure figcaption { font-size: 14px; line-height: 1.6; color: var(--ink-2); margin-top: 10px; }
.figure figcaption .no, .viz figcaption .no { font-weight: 700; color: var(--ink); margin-right: 6px; }
.figure .credit { display: block; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.figure .frame.broken { padding: 40px 20px; text-align: center; font-size: 14px; color: var(--ink-3); cursor: default; overflow-wrap: anywhere; }
.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 14px; margin: 32px 0; }
.gallery .figure { margin: 0; }
.gallery .figure img { max-height: 280px; }
.timeline { position: relative; margin: 32px 0; padding-left: 28px; }
.timeline::before { content: ''; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.tl-item { position: relative; padding: 0 0 20px; }
.tl-item::before { content: ''; position: absolute; left: -26px; top: 7px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--accent); }
.tl-date { font-family: var(--serif); font-weight: 700; color: var(--accent); font-size: 15px; }
.tl-title { font-weight: 700; font-size: 16px; }
.tl-desc { font-size: 15px; color: var(--ink-2); line-height: 1.65; }
.viz { margin: 32px 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.viz .chart-box { position: relative; height: 340px; }
.viz figcaption { font-size: 14px; color: var(--ink-2); margin-top: 10px; }
.mermaid-box { overflow-x: auto; text-align: center; }
.mermaid-box svg { max-width: 100%; height: auto; }
.compare-scroll { overflow-x: auto; margin: 32px 0; }
.compare { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; min-width: 420px; }
.compare-row { display: grid; gap: 1px; }
.compare-row > div { background: var(--surface); padding: 10px 14px; font-size: 15px; }
.compare-row.head > div { background: var(--accent); color: var(--accent-ink); font-weight: 700; font-family: var(--serif); }
.compare-row > div:first-child { background: var(--surface-2); font-weight: 700; font-size: 14px; }
.compare-row.head > div:first-child { background: var(--accent); }
.callout { margin: 24px 0; padding: 14px 18px; border-radius: var(--radius); background: var(--surface-2); border-left: 4px solid var(--ink-3); font-family: var(--sans); color: var(--ink); font-size: 16px; }
.callout .callout-title { font-weight: 700; margin-bottom: 4px; }
.callout p:last-child { margin-bottom: 0; }
.callout.key { background: var(--accent-soft); border-color: var(--accent); }
.callout.key .callout-title { color: var(--accent); }
.callout.warn { background: var(--amber-soft); border-color: var(--amber); }
.callout.warn .callout-title { color: var(--amber); }
.callout.source { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ink-2); font-family: var(--serif); }
.references { margin-top: 56px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
.references h2 { font-size: 20px; margin: 0 0 10px; }
.references ol { padding-left: 1.4em; }
.figure-credits { margin-top: 24px; font-size: 13px; }
.figure-credits summary { cursor: pointer; color: var(--ink-2); }
.figure-credits li { margin: 4px 0; }
.lecture-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 48px; }
.lecture-nav a { display: block; padding: 14px 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); text-decoration: none; color: var(--ink); }
.lecture-nav a:hover { border-color: var(--accent); }
.lecture-nav small { display: block; color: var(--ink-3); font-size: 13px; }
.lecture-nav .next { text-align: right; grid-column: 2; }

dialog.modal { border: 1px solid var(--line); border-radius: 14px; padding: 24px; background: var(--surface); color: var(--ink); width: min(520px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog.modal h2 { margin: 0 0 12px; font-size: 21px; }
dialog::backdrop { background: rgb(0 0 0 / 45%); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; transition: .2s; z-index: 50; font-size: 15px; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.lightbox { border: 0; padding: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
.lightbox img { max-width: 96vw; max-height: 84vh; display: block; margin: 0 auto; border-radius: 6px; }
.lightbox-caption { color: #eee; font-size: 14px; text-align: center; margin: 8px auto 0; max-width: 900px; }

<script src="https://cdn.jsdelivr.net/npm/marked@18.1.2/lib/marked.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.js"></script>
<script>
(() => {
'use strict';
/* ================= 강의 블록 파서 ================= */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function parseKV(text) {
  const out = {}; let last = null;
  for (const raw of String(text).split('\n')) {
    const line = raw.replace(/\s+$/, '');
    if (!line.trim()) continue;
    const m = line.match(/^([A-Za-z][\w-]*)\s*:\s?(.*)$/);
    if (m && !/^\s/.test(line)) { last = m[1].toLowerCase(); out[last] = m[2].trim(); }
    else if (last) out[last] += ' ' + line.trim();
  }
  return out;
}
function parseFigure(text) {
  const f = parseKV(text);
  return { src: f.src || '', alt: f.alt || f.caption || '', caption: f.caption || '', credit: f.credit || '',
    license: f.license || '', source: f.source || '', width: f.width || '' };
}
const parseGallery = (t) => String(t).split(/^\s*---\s*$/m).map((s) => s.trim()).filter(Boolean).map(parseFigure);
const parseTimeline = (t) => String(t).split('\n').map((l) => l.trim()).filter(Boolean).map((l) => {
  const [date = '', title = '', ...rest] = l.split('|').map((s) => s.trim());
  return { date, title, desc: rest.join(' | ') };
});
function parseCompare(t) {
  const rows = String(t).split('\n').map((l) => l.trim()).filter(Boolean).map((l) => l.split('|').map((s) => s.trim()));
  const [head = [], ...body] = rows; return { head, rows: body };
}
function extractFences(md) {
  const out = []; const re = /^(```+|~~~+)[ \t]*([\w-]*)[^\n]*\n([\s\S]*?)^\1[ \t]*$/gm; let m;
  while ((m = re.exec(md))) out.push({ lang: m[2].toLowerCase(), text: m[3], index: m.index });
  return out;
}
const stripFences = (md) => String(md).replace(/^(```+|~~~+)[\s\S]*?^\1[ \t]*$/gm, '');

/* ================= 자동 점검 ================= */
const AI_HINTS = /(midjourney|dall[\s·-]?e|stable\s*diffusion|firefly|imagen|ai[\s-]?generated|generated\s+by\s+ai|AI\s*생성|인공지능\s*생성|생성형)/i;
function validateLecture(meta = {}, body = '') {
  const issues = []; const add = (level, message) => issues.push({ level, message });
  if (!meta.title) add('error', '강의 제목이 없습니다.');
  if (!meta.summary) add('warn', '강의 요약이 없습니다.');
  if (!body.trim()) add('error', '본문이 비어 있습니다.');
  const figures = []; let timelines = 0, charts = 0, diagrams = 0, compares = 0;
  for (const f of extractFences(body)) {
    if (f.lang === 'figure') figures.push(parseFigure(f.text));
    else if (f.lang === 'gallery') figures.push(...parseGallery(f.text));
    else if (f.lang === 'timeline') timelines++;
    else if (f.lang === 'chart') { charts++; try { JSON.parse(f.text); } catch { add('error', `차트 블록의 JSON 형식이 잘못되었습니다 (${body.slice(0, f.index).split('\n').length}번째 줄).`); } }
    else if (f.lang === 'mermaid') diagrams++;
    else if (f.lang === 'compare') compares++;
  }
  figures.forEach((fig, i) => {
    const label = `그림 ${i + 1}${fig.caption ? ` “${fig.caption.slice(0, 24)}”` : ''}`;
    if (!fig.src) add('error', `${label}: 이미지 주소(src)가 없습니다.`);
    if (!fig.source) add('error', `${label}: 원본 출처(source)가 없습니다.`);
    if (!fig.license) add('error', `${label}: 이용 허락 조건(license)이 없습니다.`);
    if (!fig.credit) add('warn', `${label}: 작가·소장처·연도(credit)가 없습니다.`);
    if (!fig.caption) add('warn', `${label}: 그림 설명(caption)이 없습니다.`);
    if (AI_HINTS.test([fig.credit, fig.source, fig.license, fig.caption].join(' '))) add('error', `${label}: AI 생성 이미지로 보이는 표기가 있습니다.`);
  });
  const plain = stripFences(body);
  const bare = (plain.match(/!\[[^\]]*\]\([^)]+\)/g) || []).length;
  if (bare) add('warn', `출처 없는 일반 이미지가 ${bare}개 있습니다.`);
  const tables = (plain.match(/^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/gm) || []).length;
  const headings = (plain.match(/^#{2,3}\s+/gm) || []).length;
  const chars = plain.replace(/[#>*_`|\-\s]/g, '').length;
  const visuals = figures.length + tables + timelines + charts + diagrams + compares;
  if (body.trim() && visuals < 3) add('warn', `시각자료가 ${visuals}개뿐입니다.`);
  if (body.trim() && chars < 3000) add('warn', `본문이 약 ${chars.toLocaleString()}자로 짧습니다.`);
  const refs = Array.isArray(meta.references) ? meta.references.length : 0;
  if (!refs) add('warn', '참고문헌이 없습니다.');
  return { issues, stats: { chars, headings, figures: figures.length, tables, timelines, charts, diagrams, compares, visuals, references: refs } };
}

/* ================= 렌더러 ================= */
const PALETTE = ['#2f6b4f', '#b5532f', '#3d5a99', '#a3842a', '#7b4b94', '#3f8a8a', '#8a3d5c', '#5c6b2f'];
const CALLOUTS = { note: ['note', '참고'], 참고: ['note', '참고'], key: ['key', '핵심'], 핵심: ['key', '핵심'],
  warn: ['warn', '주의'], 주의: ['warn', '주의'], source: ['source', '사료'], 사료: ['source', '사료'],
  tip: ['key', '더 알아보기'], 더알아보기: ['key', '더 알아보기'] };
const resolveSrc = (src) => (/^asset:/i.test(src) ? '/_blob/' + src.slice(6) : src);

function figureHTML(fig) {
  const width = ['wide', 'narrow'].includes(fig.width) ? fig.width : '';
  const bits = [fig.credit, fig.license].filter(Boolean).map(esc).join(' · ');
  const link = fig.source ? (/^https?:\/\//.test(fig.source) ? ` · <a href="${esc(fig.source)}" target="_blank" rel="noopener">원본</a>` : ` · ${esc(fig.source)}`) : '';
  return `<figure class="figure ${width}" data-figure data-caption="${esc(fig.caption)}">
    <div class="frame"><img src="${esc(resolveSrc(fig.src))}" alt="${esc(fig.alt)}" loading="lazy"></div>
    <figcaption><span class="no"></span>${esc(fig.caption)}<span class="credit">${bits}${link}</span></figcaption></figure>`;
}
function blockHTML(lang, text, store) {
  switch (lang) {
    case 'figure': return figureHTML(parseFigure(text));
    case 'gallery': return `<div class="gallery">${parseGallery(text).map(figureHTML).join('')}</div>`;
    case 'timeline': return `<div class="timeline">${parseTimeline(text).map((e) => `<div class="tl-item"><div class="tl-date">${esc(e.date)}</div>
      <div class="tl-title">${esc(e.title)}</div>${e.desc ? `<div class="tl-desc">${esc(e.desc)}</div>` : ''}</div>`).join('')}</div>`;
    case 'compare': {
      const { head, rows } = parseCompare(text);
      const n = Math.max(head.length, ...rows.map((r) => r.length));
      const cols = `style="grid-template-columns: minmax(90px, .7fr) repeat(${Math.max(n - 1, 1)}, 1fr)"`;
      const row = (cells, cls = '') => `<div class="compare-row ${cls}" ${cols}>${Array.from({ length: n }, (_, i) => `<div>${esc(cells[i] ?? '')}</div>`).join('')}</div>`;
      return `<div class="compare-scroll"><div class="compare">${row(head, 'head')}${rows.map((r) => row(r)).join('')}</div></div>`;
    }
    case 'chart': {
      const id = store.push({ type: 'chart', text }) - 1; let cap = '';
      try { cap = JSON.parse(text).caption || ''; } catch {}
      return `<figure class="viz" data-viz="${id}"><div class="chart-box"><canvas></canvas></div><figcaption><span class="no"></span>${esc(cap)}</figcaption></figure>`;
    }
    case 'mermaid': {
      const id = store.push({ type: 'mermaid', text }) - 1; const cap = text.match(/^%%\s*caption:\s*(.+)$/m);
      return `<figure class="viz" data-viz="${id}"><div class="mermaid-box"><p class="muted">도식을 그리는 중…</p></div><figcaption><span class="no"></span>${esc(cap ? cap[1] : '')}</figcaption></figure>`;
    }
    default: return null;
  }
}

async function renderMarkdown(container, body) {
  const store = [];
  if (!window.marked) { container.innerHTML = `<pre>${esc(body)}</pre>`; return []; }
  const md = new window.marked.Marked({ gfm: true });
  md.use({ renderer: {
    code({ text, lang }) { return blockHTML(String(lang || '').trim().toLowerCase(), text, store) ?? false; },
    image({ href, text }) { return `<img src="${esc(resolveSrc(href))}" alt="${esc(text)}" loading="lazy">`; },
    html({ text }) { return esc(text); },
    // 한국어의 범위 표기(6~7%, 1806~07)가 취소선이 되지 않도록: ~~두 개~~만 취소선으로 처리
    del(token) {
      const inner = this.parser.parseInline(token.tokens);
      return String(token.raw).startsWith('~~') ? `<del>${inner}</del>` : `~${inner}~`;
    },
  } });
  container.innerHTML = md.parse(body || '');
  container.querySelectorAll('a[href^="http"]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; });

  let tableNo = 0;
  container.querySelectorAll('table').forEach((t) => {
    const wrap = document.createElement('div'); wrap.className = 'table-wrap'; t.replaceWith(wrap); wrap.append(t); tableNo++;
    const next = wrap.nextElementSibling;
    if (next?.tagName === 'P' && /^(표|Table)\s*[:：]/.test(next.textContent)) {
      next.className = 'table-caption';
      next.innerHTML = `<b>표 ${tableNo}.</b> ` + next.innerHTML.replace(/^(표|Table)\s*[:：]\s*/, '');
    }
  });
  container.querySelectorAll('blockquote').forEach((bq) => {
    const p = bq.querySelector('p'); const m = p?.innerHTML.match(/^\[!([^\]\s]+)\]\s*([^\n<]*)(?:\n|<br>)?/);
    if (!m) return;
    const [cls, label] = CALLOUTS[m[1].toLowerCase()] || ['note', m[1]];
    p.innerHTML = p.innerHTML.slice(m[0].length).trim(); if (!p.innerHTML) p.remove();
    const div = document.createElement('div'); div.className = `callout ${cls}`;
    div.innerHTML = `<div class="callout-title">${esc(m[2].trim() || label)}</div>` + bq.innerHTML; bq.replaceWith(div);
  });
  let figNo = 0;
  container.querySelectorAll('[data-figure], [data-viz]').forEach((f) => { figNo++; const no = f.querySelector('figcaption .no'); if (no) no.textContent = `그림 ${figNo}.`; });
  container.querySelectorAll('.figure img').forEach((img) => img.addEventListener('error', () => {
    const frame = img.parentElement; frame.classList.add('broken'); frame.textContent = `이미지를 불러오지 못했습니다: ${img.getAttribute('src')}`;
  }, { once: true }));
  const toc = []; const used = new Set();
  container.querySelectorAll('h2, h3').forEach((h, i) => {
    let id = 's-' + (h.textContent.trim().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '').slice(0, 40) || i);
    while (used.has(id)) id += '-' + i; used.add(id); h.id = id;
    toc.push({ id, level: h.tagName === 'H2' ? 2 : 3, text: h.textContent });
  });
  await hydrateViz(container, store);
  return toc;
}
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const isDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches ? document.documentElement.dataset.theme !== 'light' : document.documentElement.dataset.theme === 'dark';
let mermaidLoading = null, mermaidSeq = 0;
function loadMermaid() {
  if (window.mermaid) return Promise.resolve(window.mermaid);
  return mermaidLoading ||= new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.min.js';
    s.onload = () => res(window.mermaid); s.onerror = () => rej(new Error('도식 라이브러리를 불러오지 못했습니다.')); document.head.append(s);
  });
}
async function hydrateViz(container, store) {
  if (window.Chart) { Chart.defaults.font.family = cssVar('--sans'); Chart.defaults.color = cssVar('--ink-2'); Chart.defaults.borderColor = cssVar('--line'); }
  for (const el of container.querySelectorAll('[data-viz]')) {
    const item = store[Number(el.dataset.viz)];
    try {
      if (item.type === 'chart') {
        if (!window.Chart) throw new Error('차트 라이브러리를 불러오지 못했습니다.');
        const cfg = JSON.parse(item.text); delete cfg.caption;
        if (cfg.height) { el.querySelector('.chart-box').style.height = cfg.height + 'px'; delete cfg.height; }
        const ds = cfg.data?.datasets || [];
        const multi = ds.length > 1 || ['line', 'bar', 'scatter', 'radar'].includes(cfg.type);
        ds.forEach((d, i) => { const c = PALETTE[i % PALETTE.length];
          if (!d.backgroundColor) d.backgroundColor = multi ? c + (cfg.type === 'line' ? '33' : 'cc') : PALETTE;
          if (!d.borderColor) d.borderColor = multi ? c : cssVar('--surface'); });
        cfg.options = { responsive: true, maintainAspectRatio: false, ...(cfg.options || {}) };
        new Chart(el.querySelector('canvas'), cfg);
      } else {
        const mm = await loadMermaid();
        mm.initialize({ startOnLoad: false, securityLevel: 'strict', theme: isDark() ? 'dark' : 'neutral', fontFamily: cssVar('--sans') });
        const { svg } = await mm.render(`mmd-${Date.now()}-${mermaidSeq++}`, item.text);
        el.querySelector('.mermaid-box').innerHTML = svg;
      }
    } catch (e) {
      el.insertAdjacentHTML('afterbegin', `<div class="callout warn"><div class="callout-title">시각자료를 그리지 못했습니다</div>${esc(e.message || e)}</div>`);
      el.querySelector('.mermaid-box p')?.remove();
    }
  }
}

/* ================= 데이터 (artifact db) ================= */
// courses/{id}: {title, subtitle, description, cover:{src,credit}, order:[lectureId], createdAt, updatedAt}
// lectures/{id}: {status:'inbox'|'published'|'rejected', courseId, title, subtitle, summary, period, estimatedMinutes,
//                 objectives, suggestedCourse, suggestedOrder, references, stats, createdAt, publishedAt, rejection}
// bodies/{id}:   {body}  ← 본문 마크다운(용량이 커서 따로 저장)
const S = { db: null, canEdit: false, courses: new Map(), lectures: new Map(), ready: { c: false, l: false }, failed: '', slow: false };
const bodyCache = new Map();
const now = () => new Date().toISOString();
const sortedCourses = () => [...S.courses.values()].sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)));
const byStatus = (st) => [...S.lectures.values()].filter((l) => l.status === st);
function courseLectures(c) { return (c.order || []).map((id) => S.lectures.get(id)).filter((l) => l && l.status === 'published' && l.courseId === c.id); }
async function getBody(id) {
  if (bodyCache.has(id)) return bodyCache.get(id);
  const snap = await S.db.doc('bodies/' + id).get();
  const body = snap.exists ? String(snap.data().body || '') : '';
  bodyCache.set(id, body); return body;
}
function slugify(t) {
  const a = String(t || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 50);
  return a || 'course-' + Date.now().toString(36);
}
function uniqueCourseId(base) { let id = base, i = 2; while (S.courses.has(id)) id = `${base}-${i++}`; return id; }
async function write(fn, okMsg) {
  if (!S.db) { toast('저장소에 연결되지 않아 바꿀 수 없습니다.'); return false; }
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) {
    const msg = { quota_exceeded: '저장 공간이 가득 찼습니다. 반려함의 강의를 지운 뒤 다시 시도하세요.', revoked: '접근 권한이 바뀌어 저장할 수 없습니다.' }[e?.code];
    toast(msg || '저장하지 못했습니다. 편집 권한이 있는지 확인하세요.'); console.error(e); return false;
  }
}

/* ================= UI 공통 ================= */
const $app = document.getElementById('app');
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2800); }
const fmtDate = (s) => (s ? new Date(s).toLocaleDateString('ko-KR', { year: 'numeric', month: 'short', day: 'numeric' }) : '');
const minutes = (m) => (m ? (m >= 60 ? `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ''}` : `${m}분`) : '');
const emptyState = (t, p, a = '') => `<div class="empty-state"><h2>${t}</h2><p>${p}</p>${a}</div>`;
const coverHTML = (c) => c.cover?.src ? `<div class="cover" style="background-image:url('${esc(resolveSrc(c.cover.src)).replace(/'/g, '%27')}')" role="img" aria-label="${esc(c.title)} 표지"></div>`
  : `<div class="cover empty">${esc((c.title || '').slice(0, 2))}</div>`;
function statChips(stats) {
  if (!stats) return '';
  return `<div class="chips">${[
    `<span class="chip">본문 ${Number(stats.chars || 0).toLocaleString()}자</span>`,
    stats.figures && `<span class="chip">사진·자료 ${stats.figures}</span>`, stats.tables && `<span class="chip">표 ${stats.tables}</span>`,
    stats.timelines && `<span class="chip">연표 ${stats.timelines}</span>`, stats.diagrams && `<span class="chip">도식 ${stats.diagrams}</span>`,
    stats.charts && `<span class="chip">차트 ${stats.charts}</span>`,
  ].filter(Boolean).join('')}</div>`;
}
function modal(html, onMount) {
  const d = document.createElement('dialog'); d.className = 'modal'; d.innerHTML = html; document.body.append(d);
  d.addEventListener('close', () => d.remove());
  d.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => d.close()));
  onMount?.(d); d.showModal(); return d;
}
function confirmBox(title, text, okLabel = '확인', danger = false) {
  return new Promise((resolve) => {
    let ok = false;
    const d = modal(`<h2>${esc(title)}</h2><p style="color:var(--ink-2);margin:0 0 16px">${esc(text)}</p>

/* ================= 이어보기: 강좌마다 마지막으로 읽던 강의와 소단원 =================
   보는 사람마다 따로 저장한다. 브라우저(localStorage)에 바로 쓰고, 로그인한 경우
   본인만 읽을 수 있는 data/users/<id>/progress 문서에도 모아 두어 다른 기기에서도 이어진다. */
const PROG_KEY = 'study-progress';
const P = { map: {}, uid: null, dirty: false, timer: null, chain: Promise.resolve() };
try { const v = JSON.parse(localStorage.getItem(PROG_KEY) || '{}'); if (v && typeof v === 'object') P.map = v; } catch {}
function saveProgressLocal() { try { localStorage.setItem(PROG_KEY, JSON.stringify(P.map)); } catch {} }
function progressRef() { return S.db && P.uid ? S.db.collection('data/users/' + P.uid).doc('progress') : null; }
function flushProgress() {
  clearTimeout(P.timer); P.timer = null;
  const ref = progressRef(); if (!ref || !P.dirty) return P.chain;
  P.dirty = false; // 한 문서에는 한 번에 하나씩, 바뀌었을 때만 쓴다
  P.chain = P.chain.then(() => ref.set({ courses: P.map, updatedAt: now() })).catch((e) => console.warn('이어보기 저장 실패', e));
  return P.chain;
}
function recordProgress(cid, entry) {
  const old = P.map[cid];
  if (old && old.lid === entry.lid && old.section === entry.section && !!old.done === !!entry.done
    && old.block === entry.block && old.offset === entry.offset) return;
  P.map[cid] = { ...entry, at: now() }; saveProgressLocal(); P.dirty = true;
  clearTimeout(P.timer); P.timer = setTimeout(flushProgress, 4000);
}
async function loadProgress(user) {
  try { P.uid = user ? await user.id() : null; } catch { P.uid = null; }
  const ref = progressRef(); if (!ref) return;
  try {
    const snap = await ref.get(); const remote = (snap.exists && snap.data().courses) || {};
    let gotNewer = false, haveNewer = false;
    for (const [cid, r] of Object.entries(remote)) { const l = P.map[cid]; if (r && (!l || String(r.at) > String(l.at))) { P.map[cid] = r; gotNewer = true; } }
    for (const [cid, l] of Object.entries(P.map)) { const r = remote[cid]; if (!r || String(l.at) > String(r.at)) haveNewer = true; }
    if (gotNewer) { saveProgressLocal(); if (/^c-/.test(currentRoute || '')) route(true); }
    if (haveNewer) { P.dirty = true; flushProgress(); }
  } catch (e) { console.warn('이어보기 불러오기 실패', e); }
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushProgress(); });
/** 강좌 c에서 이어 볼 곳. 강의를 끝까지 읽었으면 다음 강의 처음. */
function resumeTarget(c) {
  const e = P.map[c.id]; if (!e) return null;
  const ls = courseLectures(c); const i = ls.findIndex((l) => l.id === e.lid); if (i < 0) return null;
  if (e.done && ls[i + 1]) return { lecture: ls[i + 1], idx: i + 1, section: null, note: `${i + 1}강을 다 읽었습니다. 다음 강의부터`, at: e.at, lastId: e.lid };
  if (e.done) return { lecture: ls[i], idx: i, section: null, note: '마지막 강의까지 다 읽었습니다', at: e.at, lastId: e.lid };
  return { lecture: ls[i], idx: i, section: e.section || null, block: e.block ?? null, offset: e.offset ?? 0,
    note: e.sectionText ? `‘${e.sectionText}’ 읽던 곳부터` : Number.isInteger(e.block) && e.block > 0 ? '읽던 곳부터' : '처음부터', at: e.at, lastId: e.lid };
}
const READ_TOP = 84; // 위쪽 고정 막대 아래, 읽는 위치의 기준선
/** 지금 화면 맨 위에 걸친 본문 블록(문단·그림·표…)의 번호와 기준선에서 떨어진 거리 */
function readingAnchor(prose) {
  const kids = prose.children;
  for (let i = 0; i < kids.length; i++) {
    const r = kids[i].getBoundingClientRect();
    if (r.bottom > READ_TOP + 1) return { block: i, offset: Math.round(r.top - READ_TOP) };
  }
  return null;
}
/** 저장된 블록 위치로 되돌아간다. 위쪽 사진·도식이 늦게 그려져 높이가 바뀌면
    그때마다 다시 맞추고, 읽는 사람이 직접 움직이거나 15초가 지나면 멈춘다. */
function restorePosition(entry, lid) {
  const prose = $app.querySelector('.prose'); if (!prose) return;
  const byBlock = Number.isInteger(entry.block) ? prose.children[entry.block] : null;
  const el = byBlock || (entry.section && document.getElementById(entry.section)); if (!el) return;
  const off = byBlock ? (Number(entry.offset) || 0) : 0;
  let stop = false;
  const evs = ['wheel', 'touchstart', 'keydown', 'mousedown'];
  const end = () => { if (stop) return; stop = true; ro.disconnect(); evs.forEach((t) => window.removeEventListener(t, end)); };
  const align = () => {
    if (stop) return; if (currentRoute !== 'l-' + lid) return end();
    const d = el.getBoundingClientRect().top - (READ_TOP + off);
    if (Math.abs(d) > 1) window.scrollBy({ top: d, behavior: 'instant' });
  };
  const ro = new ResizeObserver(align); ro.observe(prose);
  evs.forEach((t) => window.addEventListener(t, end, { passive: true }));
  align(); setTimeout(end, 15000);
}

let cleanup = null;
function trackReading(toc, ctx) {
  const bar = document.getElementById('read-progress'); const links = [...document.querySelectorAll('.toc a')];
  let first = true;
  const onScroll = () => {
    const h = document.documentElement; const frac = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
    bar.style.width = Math.min(100, frac * 100) + '%';
    let cur = null; for (const t of toc) { const el = document.getElementById(t.id); if (el && el.getBoundingClientRect().top < 120) cur = t; }
    links.forEach((a) => a.classList.toggle('on', a.dataset.target === cur?.id));
    if (ctx?.cid) {
      const old = P.map[ctx.cid]; const same = old?.lid === ctx.lid;
      // 같은 강의를 다시 열었을 때 맨 위에 있다는 이유로 읽던 위치를 지우지 않는다
      if (first && same) { first = false; return; }
      first = false;
      clearTimeout(spotTimer);
      spotTimer = setTimeout(() => {
        const a = prose ? readingAnchor(prose) : null;
        recordProgress(ctx.cid, { lid: ctx.lid, section: cur?.id || null, sectionText: cur?.text || null,
          block: a ? a.block : null, offset: a ? a.offset : 0, done: (same && !!old.done) || frac >= 0.95 });
      }, 250);
    }
  };
  const prose = $app.querySelector('.prose'); let spotTimer = null;
  window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
  cleanup = () => { window.removeEventListener('scroll', onScroll); bar.style.width = '0'; clearTimeout(spotTimer); flushProgress(); };
}

  const c = S.courses.get(l.courseId); const ls = c ? courseLectures(c) : [l];
  const idx = ls.findIndex((x) => x.id === lid); const prev = ls[idx - 1], next = ls[idx + 1];
  document.title = `${idx + 1}강 ${l.title} · ${c?.title || ''}`;
  $app.innerHTML = `<div class="reader"><aside class="toc"></aside><article>

    <nav class="lecture-nav">
      ${prev ? `<a class="prev" href="#l-${prev.id}"><small>← 이전 ${idx}강</small>${esc(prev.title)}</a>` : ''}
      ${next ? `<a class="next" href="#l-${next.id}"><small>다음 ${idx + 2}강 →</small>${esc(next.title)}</a>` : ''}
    </nav></article></div>`;
  const body = await getBody(lid);
  if (currentRoute !== 'l-' + lid) return;
  const toc = await mountBody($app, body);
  const resume = S.resume; S.resume = null;
  if (resume?.lid === lid && (resume.section || Number.isInteger(resume.block))) restorePosition(resume, lid);
  trackReading(toc, c ? { cid: c.id, lid } : null);
}

    ${S.canEdit && quickable.length > 1 ? `<button class="btn primary" type="button" id="approve-all">✓ 전체 승인 (${quickable.length}개)</button>` : ''}</div>

      return `<div class="card inbox-item"><div>
        <div class="eyebrow">${sc ? `제안: ${esc(sc.title || sc.id)}${it.suggestedOrder ? ` ${it.suggestedOrder}강` : ''}${S.courses.has(sc.id) ? '' : ' (새 강좌)'}` : '강좌 미지정'} · ${fmtDate(it.createdAt)}</div>
        <h3><a href="#review-${it.id}">${esc(it.title)}</a></h3><p>${esc(it.subtitle || it.summary)}</p>${statChips(it.stats)}</div>
        <div class="inbox-actions"><a class="btn" href="#review-${it.id}">검토하기</a>${S.canEdit && sc && (sc.id || sc.title)

/* 검토함 전체 승인: 강의마다 제안된 강좌의 제안된 순서 자리에 넣는다 */
const groupKey = (sc) => (sc.id && S.courses.has(sc.id) ? 'c:' + sc.id : 'n:' + (sc.id || sc.title));
function placeInOrder(order, lid) {
  const so = S.lectures.get(lid)?.suggestedOrder;
  const j = so ? order.findIndex((x) => (S.lectures.get(x)?.suggestedOrder ?? Infinity) > so) : -1;
  order.splice(j >= 0 ? j : order.length, 0, lid);
}
async function approveAll(ids, btn) {
  const ls = ids.map((id) => S.lectures.get(id)).filter((l) => l && l.status === 'inbox' && l.suggestedCourse)
    .sort((a, b) => (a.suggestedOrder ?? Infinity) - (b.suggestedOrder ?? Infinity));
  if (!ls.length) return;
  const groups = new Map();
  for (const l of ls) { const k = groupKey(l.suggestedCourse); if (!groups.has(k)) groups.set(k, { sc: l.suggestedCourse, items: [] }); groups.get(k).items.push(l); }
  const lines = [...groups.values()].map(({ sc, items }) => {
    const c = S.courses.get(sc.id);
    return `‘${c ? c.title : sc.title || sc.id}’${c ? '' : '(새 강좌)'}에 ${items.length}개`;
  });
  if (!await confirmBox('전체 승인', `검토함의 강의 ${ls.length}개를 제안된 강좌의 제안된 순서 자리에 넣습니다. ${lines.join(', ')}.`, `${ls.length}개 모두 승인`)) return;
  const label = btn.textContent; btn.disabled = true;
  const reps = new Map(); let errs = 0;
  try {
    for (const [i, l] of ls.entries()) {
      btn.textContent = `점검 중… ${i + 1}/${ls.length}`;
      const rep = validateLecture(l, await getBody(l.id)); reps.set(l.id, rep);
      if (rep.issues.some((x) => x.level === 'error')) errs++;
    }
  } catch (e) { console.error(e); btn.disabled = false; btn.textContent = label; return toast('본문을 불러오지 못했습니다.'); }
  if (errs && !await confirmBox('점검 오류가 있습니다', `자동 점검 오류가 있는 강의가 ${errs}개 있습니다. 그래도 모두 승인할까요?`, '그래도 승인')) {
    btn.disabled = false; btn.textContent = label; return;
  }
  let done = 0;
  const ok = await write(async () => {
    for (const { sc, items } of groups.values()) {
      const c = S.courses.get(sc.id);
      let cid;
      if (c) {
        cid = c.id;
        const order = (c.order || []).filter((x) => !items.some((l) => l.id === x) && S.lectures.get(x)?.status === 'published');
        for (const l of items) placeInOrder(order, l.id);
        await S.db.doc('courses/' + cid).update({ order, updatedAt: now() });
      } else {
        const title = sc.title || sc.id;
        cid = uniqueCourseId(sc.id && !S.courses.has(sc.id) ? sc.id : slugify(title));
        const order = []; for (const l of items) placeInOrder(order, l.id);
        await S.db.doc('courses/' + cid).set({ title, subtitle: sc.subtitle || '', description: sc.description || '', cover: sc.cover || null,
          order, createdAt: now(), updatedAt: now() });
      }
      // 강좌 순서를 먼저 저장하고 강의를 게시한다. 중간에 멈춰도 게시되지 않은 강의는 강좌에 보이지 않는다.
      for (const l of items) {
        btn.textContent = `승인 중… ${done + 1}/${ls.length}`;
        await S.db.doc('lectures/' + l.id).update({ status: 'published', courseId: cid, publishedAt: now(), reviewNote: null, rejection: null, stats: reps.get(l.id).stats });
        done++;
      }
    }
  });
  if (ok) toast(`강의 ${done}개를 승인해 강좌에 넣었습니다.`);
  else { toast(`${ls.length}개 가운데 ${done}개만 승인했습니다. 다시 시도하면 나머지를 승인합니다.`); btn.disabled = false; btn.textContent = label; }
}

/* 검토함에서 바로 승인: 제안된 강좌의 제안된 순서 자리에 넣는다 */
async function quickApprove(lid, btn) {
  const l = S.lectures.get(lid); if (!l || l.status !== 'inbox') return;
  const sc = l.suggestedCourse || {}; const c = sc.id ? S.courses.get(sc.id) : null;
  const pubs = c ? courseLectures(c) : [];
  let idx = pubs.length;
  if (l.suggestedOrder) { const j = pubs.findIndex((x) => (x.suggestedOrder ?? Infinity) > l.suggestedOrder); if (j >= 0) idx = j; }
  const courseTitle = c ? c.title : (sc.title || sc.id);
  if (!await confirmBox('바로 승인', `‘${l.title}’을(를) ‘${courseTitle}’ ${idx + 1}강으로 넣습니다.${c ? '' : ' 이 강좌는 새로 만들어집니다.'}`, '승인하고 넣기')) return;
  btn.disabled = true;
  let rep;
  try { rep = validateLecture(l, await getBody(lid)); } catch (e) { console.error(e); btn.disabled = false; return toast('본문을 불러오지 못했습니다.'); }
  const errs = rep.issues.filter((i) => i.level === 'error').length;
  if (errs && !await confirmBox('점검 오류가 있습니다', `자동 점검 오류가 ${errs}건 있습니다. 그래도 승인할까요?`, '그래도 승인')) { btn.disabled = false; return; }
  const ok = await write(async () => {
    let cid;
    if (c) {
      cid = c.id;
      const order = (c.order || []).filter((x) => x !== lid && S.lectures.get(x)?.status === 'published');
      const before = pubs[idx]?.id; const at = before ? order.indexOf(before) : -1;
      order.splice(at >= 0 ? at : order.length, 0, lid);
      await S.db.doc('courses/' + cid).update({ order, updatedAt: now() });
    } else {
      const title = sc.title || sc.id;
      cid = uniqueCourseId(sc.id && !S.courses.has(sc.id) ? sc.id : slugify(title));
      await S.db.doc('courses/' + cid).set({ title, subtitle: sc.subtitle || '', description: sc.description || '', cover: sc.cover || null,
        order: [lid], createdAt: now(), updatedAt: now() });
    }
    await S.db.doc('lectures/' + lid).update({ status: 'published', courseId: cid, publishedAt: now(), reviewNote: null, rejection: null, stats: rep.stats });
  });
  if (ok) toast(`‘${l.title}’을(를) ‘${courseTitle}’ ${idx + 1}강으로 게시했습니다.`);
  else btn.disabled = false;
}

    <div class="review-layout"><div class="reader"><article>

> 실제 사진, 회화, 판화, 지도, 문서 사진 등 **실물 자료만** 씁니다. 모든 그림에 원본 출처(source)와 이용 허락 조건(license)을 적고, 빠지면 자동 점검에서 오류로 표시됩니다.

사진은 위키미디어 공용 등 공개 소장처에서 받아 이 앱의 자료 저장소에 올린 뒤 씁니다.

## 본문 문법

일반 마크다운(제목, 표, 목록, 인용)에 더해 아래 블록을 씁니다. 제목(##, ###)은 자동으로 목차가 되고, 그림 번호는 자동으로 매겨집니다.

| 블록 | 용도 | 한 줄 형식 |
|---|---|---|
| figure | 사진·사료 1장 | src / caption / credit / license / source / width |
| gallery | 사진 여러 장 | figure 형식을 --- 줄로 구분 |
| timeline | 연표 | 연도 \| 사건 \| 설명 |
| compare | 비교표 | 항목 \| A \| B |
| chart | 차트 | Chart.js 설정 JSON (+caption, height) |
| mermaid | 흐름도·관계도 | Mermaid 문법 (첫 줄 %% caption: 설명) |

표: 특수 블록

~~~
` + '```' + String.raw`figure
src: asset:파일ID
caption: 그림 설명
credit: 작가 또는 소장처, 제작 연도

- 표 바로 아래 줄에 "표: 설명"을 쓰면 표 번호와 캡션이 붙습니다.
- 인용문 첫 줄에 [!핵심], [!참고], [!주의], [!사료], [!더알아보기]를 쓰면 강조 상자가 됩니다.

async function viewGuide() {
  $app.innerHTML = `<div class="reader"><aside class="toc"></aside><article><div class="lecture-head"><h1>작성 규격</h1><p class="sub">강의가 갖춰야 할 형식과 검토 기준</p></div><div class="prose"></div></article></div>`;
  trackReading(await mountBody($app, GUIDE));
}
function notFound(t) { $app.innerHTML = emptyState(t, '삭제되었거나 주소가 잘못되었습니다.', '<p><a class="btn" href="#">강좌로</a></p>'); }

/* ================= 라우터 ================= */
let currentRoute = null;
async function route(force = false) {
  const h = location.hash.replace(/^#/, '');
  if (/^s-/.test(h)) return; // 목차 앵커
  const loaded = S.ready.c && S.ready.l;
  if (!force && h === currentRoute && /^(l|review|r)-/.test(h)) return; // 읽는 중인 강의는 실시간 갱신으로 다시 그리지 않음
  currentRoute = h;
  cleanup?.(); cleanup = null;
  const nav = h === '' || /^(c|l)-/.test(h) ? 'library' : h === 'inbox' || /^review-/.test(h) ? 'inbox' : h === 'rejected' || /^r-/.test(h) ? 'rejected' : h === 'guide' ? 'guide' : '';
  document.querySelectorAll('[data-nav]').forEach((a) => a.classList.toggle('active', a.dataset.nav === nav));
  document.title = '강의 서재';
  if (h === 'guide') { window.scrollTo(0, 0); return viewGuide(); }
  if (S.failed) { $app.innerHTML = emptyState('강의 저장소를 열 수 없습니다', esc(S.failed)); return; }
  if (!loaded) {
    $app.innerHTML = emptyState('강의 서재를 여는 중입니다', S.slow ? '저장소가 아직 응답하지 않습니다. 네트워크 연결을 확인하세요.' : '강좌와 검토함 목록을 불러오고 있습니다.');
    currentRoute = null; return;
  }
  window.scrollTo(0, 0);
  let m;
  try {
    if (h === '') viewLibrary();
    else if (h === 'inbox') viewInbox();
    else if (h === 'rejected') viewRejected();
    else if ((m = h.match(/^c-(.+)$/))) viewCourse(m[1]);
    else if ((m = h.match(/^l-(.+)$/))) await viewLecture(m[1]);
    else if ((m = h.match(/^review-(.+)$/))) await viewDraft(m[1], false);
    else if ((m = h.match(/^r-(.+)$/))) await viewDraft(m[1], true);
    else notFound('페이지를 찾을 수 없습니다');
  } catch (e) { console.error(e); $app.innerHTML = emptyState('화면을 그리지 못했습니다', esc(e.message || e), '<p><a class="btn" href="#">강좌로</a></p>'); }
}
window.addEventListener('hashchange', () => route());

// 실시간 갱신: 목록 화면만 다시 그림(읽는 중인 강의는 유지)
let rerenderTimer = null;
function onData() {
  updateBadge();
  clearTimeout(rerenderTimer);
  rerenderTimer = setTimeout(() => {
    const h = location.hash.replace(/^#/, '');
    if (!/^(l|review|r|s)-/.test(h) || currentRoute === null) route(true);
  }, 60);
}

/* ================= 시작 ================= */
async function start() {
  route();
  if (!window.claude?.use) { S.failed = '이 페이지는 claude.ai에서 열어야 강의 저장소에 연결됩니다.'; route(true); return; }
  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  if (!db) { S.failed = 'claude.ai에 로그인한 상태에서 열어 주세요.'; route(true); return; }
  S.db = db;
  loadProgress(user);
  try { S.canEdit = user ? !!(await user.canEdit()) : false; } catch { S.canEdit = false; }
  const timer = setTimeout(() => { S.slow = true; route(true); }, 10000);
  const handle = (key, map) => (snap) => {
    map.clear(); snap.docs.forEach((d) => map.set(d.id, { id: d.id, ...d.data() }));
    if (!snap.metadata.fromCache) { S.ready[key] = true; if (S.ready.c && S.ready.l) clearTimeout(timer); }
    else if (snap.size) S.ready[key] = true;
    onData();
  };
  const fail = (e) => { clearTimeout(timer); S.failed = e?.code === 'revoked' ? '접근 권한이 바뀌었습니다.' : '저장소 연결이 끊겼습니다. 페이지를 다시 열어 주세요.'; route(true); };
  db.collection('courses').onSnapshot(handle('c', S.courses), fail);
  db.collection('lectures').onSnapshot((snap) => {
    // 본문 캐시: 문서가 바뀌면 다시 읽음
    snap.docChanges().forEach((ch) => { if (ch.type !== 'added') bodyCache.delete(ch.doc.id); });
    handle('l', S.lectures)(snap);
  }, fail);
}
start();
})();
